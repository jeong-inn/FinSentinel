[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsentinel"
version = "1.0.0"
description = "Financial anomaly detection pipeline"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-ignore = ["E203", "E501"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
